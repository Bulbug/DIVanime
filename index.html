<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a1c">
<title>DIVAnime</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<script src="theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="catalog">
<header>
  <h1 id="home" tabindex="0" role="button" aria-label="DIVAnime home">
    <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color:var(--accent)"/>
          <stop offset="1" style="stop-color:var(--accent-solid)"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#logoGrad)"/>
      <rect x="12" y="12" width="3" height="24" rx="1.5" fill="#fff" opacity=".4"/>
      <path d="M21 14 L36 24 L21 34 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <span class="word"><b>DIV</b>Anime</span>
  </h1>
  <div class="searchbox">
    <input id="search" type="search" placeholder="Search anime" aria-label="Search anime" autocomplete="off"
           role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
    <ul id="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
  </div>
  <button class="btn navbtn" id="randomBtn">Random</button>
  <button class="btn navbtn" id="listBtn">My Watchlist (<span id="count">0</span>)</button>
  <select id="theme" aria-label="Theme">
    <option value="midnight">Midnight</option>
    <option value="abyss">Abyss</option>
    <option value="light">Light</option>
  </select>
</header>
<div id="banner" class="banner" role="status" hidden></div>
<section class="hero" aria-label="Welcome">
  <h2>What are you watching next?</h2>
  <p>Browse what's popular, keep track of your episodes, and go straight to the official place to watch.</p>
</section>
<nav id="tabs" aria-label="Catalog tabs">
  <button class="tab" data-tab="top" aria-pressed="true">Top</button>
  <button class="tab" data-tab="airing" aria-pressed="false">Airing now</button>
  <button class="tab" data-tab="upcoming" aria-pressed="false">Upcoming</button>
  <button class="tab" data-tab="latest" aria-pressed="false">Latest episodes</button>
  <select id="sort" aria-label="Sort by">
    <option value="default">Sort: Default</option>
    <option value="score">Highest score</option>
    <option value="popularity">Most popular</option>
    <option value="newest">Newest</option>
    <option value="title">A to Z</option>
  </select>
</nav>
<nav id="genres" aria-label="Genres"></nav>
<main id="app"></main>
<footer>
  <p class="muted">Your watchlist and progress are saved in this browser only. Export them to back up or move to another device. Import adds to what you already have.</p>
  <button class="btn small ghost" id="exportBtn">Export data</button>
  <button class="btn small ghost" id="importBtn">Import data</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <p class="muted" id="dataMsg" role="status"></p>
</footer>

<script src="official.js"></script>
<script src="script.js"></script>
</body>
</html>
